name: fitness-app

services:
  fitness-profile-service:
    build:
      context: .
      dockerfile: FitnessProfileService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${PROFILE_CONNECTION_STRING:-}"
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  identity-service:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${IDENTITY_CONNECTION_STRING:-}"
      Jwt__Audience: "${IDENTITY_JWT_AUDIENCE:?Set IDENTITY_JWT_AUDIENCE in .env}"
      RsaKeys__PrivateKeyPath: /var/lib/identity/keys/private.pem
      RsaKeys__PublicKeyPath: /var/lib/identity/keys/public.pem
      Email__Host: "${IDENTITY_EMAIL_HOST:-smtp.gmail.com}"
      Email__Port: "${IDENTITY_EMAIL_PORT:-587}"
      Email__EnableSsl: "${IDENTITY_EMAIL_ENABLE_SSL:-true}"
      Email__UserName: "${IDENTITY_EMAIL_USERNAME:?Set IDENTITY_EMAIL_USERNAME in .env}"
      Email__Password: "${IDENTITY_EMAIL_PASSWORD:?Set IDENTITY_EMAIL_PASSWORD in .env}"
      Email__From: "${IDENTITY_EMAIL_FROM:?Set IDENTITY_EMAIL_FROM in .env}"
    volumes:
      - identity-rsa-keys:/var/lib/identity/keys
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  nutrition-service:
    build:
      context: .
      dockerfile: NutritionService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${NUTRITION_CONNECTION_STRING:-}"
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  payment-service:
    build:
      context: .
      dockerfile: PaymentService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${PAYMENT_CONNECTION_STRING:-}"
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  progress-service:
    build:
      context: .
      dockerfile: ProgressService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${PROGRESS_CONNECTION_STRING:-}"
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  training-service:
    build:
      context: .
      dockerfile: TrainingService/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${TRAINING_CONNECTION_STRING:-}"
    depends_on:
      sql-server:
        condition: service_healthy
    networks: [fitness-network]

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - fitness-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [fitness-network]

volumes:
  fitness-sql-data:
    name: fitness-sql-data-v2
  identity-rsa-keys:
    name: fitness-identity-rsa-keys

networks:
  fitness-network:
    driver: bridge
