
x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"

x-sql-dependency: &sql-dependency
  sql-server:
    condition: service_started

services:
  fitness-profile-service:
    ports:
      - "5001:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=FitnessProfileDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  identity-service:
    ports:
      - "5002:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  nutrition-service:
