      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=TrainingDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  sql-server:
    ports:
      - "127.0.0.1:14330:1433"
