x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"

x-sql-dependency: &sql-dependency
  sql-server:
    condition: service_healthy

services:
  fitness-profile-service:
    ports:
      - "5001:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=FitnessProfileDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  identity-service:
    ports:
      - "5002:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
      Jwt__Audience: "${IDENTITY_JWT_AUDIENCE:?Set IDENTITY_JWT_AUDIENCE in .env}"
      RsaKeys__PrivateKeyPath: "/var/lib/identity/keys/private.pem"
      RsaKeys__PublicKeyPath: "/var/lib/identity/keys/public.pem"
      DevelopmentSetup__GenerateRsaKeys: "true"
      DevelopmentSetup__ApplyMigrations: "true"
      Email__Host: "${IDENTITY_EMAIL_HOST:-smtp.gmail.com}"
      Email__Port: "${IDENTITY_EMAIL_PORT:-587}"
      Email__EnableSsl: "${IDENTITY_EMAIL_ENABLE_SSL:-true}"
      Email__UserName: "${IDENTITY_EMAIL_USERNAME:?Set IDENTITY_EMAIL_USERNAME in .env}"
      Email__Password: "${IDENTITY_EMAIL_PASSWORD:?Set IDENTITY_EMAIL_PASSWORD in .env}"
      Email__From: "${IDENTITY_EMAIL_FROM:?Set IDENTITY_EMAIL_FROM in .env}"
    volumes:
      - identity-rsa-keys:/var/lib/identity/keys
    depends_on: *sql-dependency

  nutrition-service:
    ports:
      - "5003:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=NutritionDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  payment-service:
    ports:
      - "5004:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=PaymentDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  progress-service:
    ports:
      - "5005:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=ProgressDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  training-service:
    ports:
      - "5006:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=TrainingDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  sql-server:
    ports:
      - "127.0.0.1:14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  identity-rsa-keys:
    name: fitness-identity-rsa-keys