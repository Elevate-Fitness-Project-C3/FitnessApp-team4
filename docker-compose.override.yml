    depends_on: *sql-dependency

  payment-service:
    ports:
      - "5004:8080"
    environment:
      <<: *service-environment
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=PaymentDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    depends_on: *sql-dependency

  progress-service:
